<!doctype html>
<html lang="ja">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>参照モック・レスポンシブ確認</title>
<style>
body{margin:0;background:#e8edf0;font:14px sans-serif;color:#18252f}
header{padding:10px 12px;background:#18252f;color:#fff;position:sticky;top:0;z-index:2;display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center}
select,label{font:inherit}
iframe{display:block;border:0;margin:20px auto;height:820px;background:#fff;box-shadow:0 0 0 1px #9aa}
#status{opacity:.85}
</style>
<header>
  <span>CSS表示幅の確認（実機エミュレーションではありません）</span>
  <label>ページ
    <select id="page"><option value="/">トップ</option><option value="/low/">特商法表記</option><option value="/privacy-policy/">プライバシーポリシー</option></select>
  </label>
  <label>幅 <select id="width"></select> px</label>
  <label>モード
    <select id="mode"><option value="0">原本忠実</option><option value="1">改善モード（?fixes=1）</option></select>
  </label>
  <span id="status"></span>
</header>
<iframe title="参照モック" style="width:390px"></iframe>
<script>
// 原CSSのmax-width境界（1600/1400/1200/1000/800/600/460/400/375/350）と±1px
var bps=[1600,1400,1200,1000,800,600,460,400,375,350],ws=[1920,1280,390];
bps.forEach(function(b){ws.push(b-1,b,b+1)});
ws=ws.filter(function(v,i,a){return a.indexOf(v)===i}).sort(function(a,b){return b-a});
var frame=document.querySelector('iframe'),W=document.getElementById('width'),P=document.getElementById('page'),M=document.getElementById('mode');
ws.forEach(function(w){var o=document.createElement('option');o.value=w;o.textContent=w+(bps.indexOf(w)>=0?'（境界）':'');if(w===390)o.selected=true;W.appendChild(o)});
function load(){frame.src=P.value+'?fixes='+M.value}
W.onchange=function(){frame.style.width=W.value+'px'};P.onchange=load;M.onchange=load;load();
setInterval(function(){try{var d=frame.contentDocument;document.getElementById('status').textContent='layout: '+d.documentElement.clientWidth+'px / scroll: '+d.documentElement.scrollWidth+'px'}catch(e){}},1000);
</script>
</html>
